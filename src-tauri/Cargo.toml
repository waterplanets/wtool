[package]
name = "wtool"
version = "0.1.0"
description = "RPG Maker 游戏的嵌入式实时翻译工具（MV / MZ / RGSS3）"
authors = ["wtool contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wtool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest 不是新引入的第三方 —— tauri 依赖树里本来就有它（tauri 内部网络请求
# 用的就是 reqwest）。这里显式声明并启用 blocking + json 两个 feature，直接复用，
# 避免再引一个 HTTP 栈。翻译层的 worker 线程用阻塞客户端最直白。
reqwest = { version = "0.12", features = ["json", "blocking"] }
# 枚举系统已装字体（GUI 的字体菜单）。tauri 依赖树里本来就有它，这里只把
# feature 收到用得到的两个：GDI 的 EnumFontFamiliesExW + 几个基础类型。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
# flate2 不是新引入的第三方 —— tauri 依赖树里本来就有它（png/image 那一路用的）。
# 这里显式声明，用来解 `Scripts.rvdata2` 里逐段 zlib 压缩的 Ruby 源码：
# 那份源码是 WF-RGSS 文案（图鉴说明、帮助文本）的主要载体，不解开就整段漏掉。
# 用默认的纯 Rust 后端（miniz_oxide），不引 C 依赖。
flate2 = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
